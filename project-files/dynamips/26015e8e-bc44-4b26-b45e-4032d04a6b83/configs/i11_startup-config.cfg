!

!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R11
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 ip address 40.0.0.2 255.255.255.252
 duplex half
!
interface FastEthernet1/0
 ip address 45.0.0.1 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet1/1
 ip address 55.0.0.1 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet2/0
 no ip address
 shutdown
 negotiation auto
!
interface Ethernet3/0
 no ip address
 shutdown
 duplex half
!
interface Ethernet3/1
 no ip address
 shutdown
 duplex half
!
interface Ethernet3/2
 no ip address
 shutdown
 duplex half
!
interface Ethernet3/3
 no ip address
 shutdown
 duplex half
!
interface Ethernet3/4
 no ip address
 shutdown
 duplex half
!
interface Ethernet3/5
 no ip address
 shutdown
 duplex half
!
interface Ethernet3/6
 no ip address
 shutdown
 duplex half
!
interface Ethernet3/7
 no ip address
 shutdown
 duplex half
!
interface Serial4/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial4/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial4/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial4/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial4/4
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial4/5
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial4/6
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial4/7
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial5/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial5/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial5/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial5/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface POS6/0
 no ip address
 shutdown
!
router bgp 600
 no synchronization
 bgp router-id 11.11.11.11
 bgp log-neighbor-changes
 network 40.0.0.0 mask 255.255.255.252
 network 45.0.0.0 mask 255.255.255.252
 network 55.0.0.0 mask 255.255.255.252
 neighbor 40.0.0.1 remote-as 500
 neighbor 45.0.0.2 remote-as 600
 neighbor 45.0.0.2 next-hop-self
 neighbor 55.0.0.2 remote-as 600
 neighbor 55.0.0.2 next-hop-self
 no auto-summary
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
